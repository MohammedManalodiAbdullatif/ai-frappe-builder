name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Typecheck
        run: |
          mypy ai_frappe_builder

      - name: Run Frontend Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit & Contract Tests with Coverage
        run: |
          pytest tests/unit tests/contract tests/golden --cov=ai_frappe_builder --cov-report=xml --cov-report=term-missing --cov-fail-under=85

  bench-integration-test:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker/setup-buildx-action@v3

      - name: Build Frappe v15 Test Bench Container
        run: |
          docker compose -f docker/docker-compose.test.yml build

      - name: Start Bench Services (MariaDB, Redis, Bench)
        run: |
          docker compose -f docker/docker-compose.test.yml up -d
          # Wait for bench site readiness
          docker compose -f docker/docker-compose.test.yml exec -T bench wait-for-it.sh db:3306 -t 60

      - name: Run Golden App Bench Verification
        run: |
          python -m ai_frappe_builder.services.bench_runner --all-golden
